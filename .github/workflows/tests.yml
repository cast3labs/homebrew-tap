name: Tests

# Runs on GitHub-hosted runners only. This repo must never have a self-hosted
# runner: it is public, and a fork's pull request could run code on it.
# Only GitHub-owned actions, pinned by commit SHA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    strategy:
      fail-fast: false
      matrix:
        # The cask allows macOS 14 (Sonoma). Homebrew 7 still runs there, with
        # a warning that the version is unsupported, so 14 is tested too.
        os: [macos-26, macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
      # Read-only; lifts the GitHub API rate limit for audit and livecheck.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The designated-requirement fixture is present
        run: grep -q '5GB46V9555' ci/expected-dr.txt

      - name: Homebrew is current
        # Runner images lag behind; users run the latest Homebrew.
        run: |
          brew update --quiet
          brew --version | head -1
          sw_vers

      - name: The tap installs from this checkout
        run: |
          set -euo pipefail
          brew tap cast3labs/tap "$GITHUB_WORKSPACE"
          # The tap must hold exactly this commit's casks.
          diff -r Casks "$(brew --repository cast3labs/tap)/Casks"

      - name: Every cask passes style and audit
        run: |
          set -euo pipefail
          casks=$(find Casks -name '*.rb' | wc -l | tr -d ' ')
          echo "casks: $casks"
          for f in Casks/*.rb; do
            [ -e "$f" ] || continue
            token="cast3labs/tap/$(basename "$f" .rb)"
            brew style --cask "$token"
            brew audit --cask --strict --online "$token"
          done
          if [ "$casks" -gt 0 ]; then
            brew audit --tap=cast3labs/tap
          fi

      - name: livecheck finds the latest release
        if: hashFiles('Casks/omac.rb') != ''
        run: brew livecheck --cask cast3labs/tap/omac

      - name: check-omac.sh refuses to run off CI
        # It kills Omac and deletes its config, so a maintainer's Mac is off limits.
        run: |
          set -euo pipefail
          rc=0
          out="$(env -u GITHUB_ACTIONS -u CI bash ci/check-omac.sh 2>&1)" || rc=$?
          echo "$out"
          [ "$rc" = 2 ] || { echo "::error::expected exit 2 off CI, got $rc"; exit 1; }
          grep -q 'refusing to run' <<<"$out"

      - name: omac installs, launches, and uninstalls cleanly
        if: hashFiles('Casks/omac.rb') != ''
        run: bash ci/check-omac.sh cast3labs/tap/omac
