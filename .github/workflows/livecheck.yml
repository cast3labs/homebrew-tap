name: Livecheck

# Once a day: is the cask behind the latest Omac release? If it is, open one
# issue, and never a second while that one is open. The release pipeline bumps
# the cask (scripts/bump-cask.sh in the Omac repo); this catches a bump that
# did not happen. GitHub-hosted runner only; GitHub-owned actions pinned by SHA.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  livecheck:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Homebrew is current
        run: brew update --quiet

      - name: The tap installs from this checkout
        run: brew tap cast3labs/tap "$GITHUB_WORKSPACE"

      - name: Open an issue if the cask is behind
        run: |
          set -euo pipefail
          json="$(brew livecheck --cask --json cast3labs/tap/omac)"
          echo "$json"
          current="$(jq -r '.[0].version.current' <<<"$json")"
          latest="$(jq -r '.[0].version.latest' <<<"$json")"
          outdated="$(jq -r '.[0].version.outdated' <<<"$json")"
          if [ "$outdated" != true ]; then
            echo "The cask is current: $current (latest release $latest)."
            exit 0
          fi
          marker="omac cask is behind"
          open="$(gh issue list --state open --search "\"$marker\" in:title" --json number --jq 'length')"
          if [ "$open" != 0 ]; then
            echo "The cask is behind ($current < $latest); an issue is already open."
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The cask points at Omac $current, but the latest release is $latest.

          The release pipeline normally bumps it. To bump it by hand, from the Omac repo:

              scripts/bump-cask.sh v$latest --dry-run
              scripts/bump-cask.sh v$latest

          Found by the daily livecheck workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh issue create --title "$marker: $current, latest release $latest" --body-file "$RUNNER_TEMP/body.md"
